name: forme
description: "Forme AI — See yourself changing."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  firebase_analytics: ^13.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  firebase_remote_config: ^7.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  google_mlkit_pose_detection: ^0.16.1
  health: ^13.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  purchases_flutter: ^10.17.0
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  config:
    # GoogleMLKit (pose) ships as CocoaPods only; mixing it with Firebase via
    # Swift Package Manager duplicates GoogleDataTransport at link time.
    enable-swift-package-manager: false
  assets:
    - assets/seed/exercises.json
