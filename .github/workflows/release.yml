name: Release (per iteration)

# Push a tag like `v0.1.0-iter1` to build and publish installable test builds
# on GitHub Releases next to the source. Or run it by hand (Actions → Run).
#
# Assets are *dogfood* builds (Flutter profile mode: AOT-compiled and fast, with
# the debug time controls testers need). Store builds go through Fastlane.
#
# Optional repository secrets:
#   CONFIG_DEV_JSON          app/config/dev.json contents → app talks to the dev
#                            backend. Without it the app runs the offline demo.
#   ANDROID_KEYSTORE_BASE64  upload keystore (base64) +
#   ANDROID_KEY_PROPERTIES   key.properties contents (storeFile=upload.jks …)
#                            → stable signature, so new APKs install over old ones.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0-iter1)"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: App config (dev backend or offline demo)
        env:
          CONFIG_DEV_JSON: ${{ secrets.CONFIG_DEV_JSON }}
        run: |
          if [ -n "$CONFIG_DEV_JSON" ]; then
            printf '%s' "$CONFIG_DEV_JSON" > config/dev.json
            echo "DEFINES=--dart-define-from-file=config/dev.json" >> "$GITHUB_ENV"
            echo "MODE=dev-backend" >> "$GITHUB_ENV"
          else
            echo "DEFINES=--dart-define-from-file=config/demo.json" >> "$GITHUB_ENV"
            echo "MODE=offline-demo" >> "$GITHUB_ENV"
          fi
      - name: Signing (optional)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYPROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYPROPS" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > android/app/upload.jks
            printf '%s' "$KEYPROPS" > android/key.properties
          fi
      - run: flutter pub get
      - run: flutter test
      - name: Build universal APK (arm64, arm, x86_64 — phones and emulators)
        run: flutter build apk --profile --flavor dev --build-name "${TAG#v}" --build-number "${{ github.run_number }}" $DEFINES
      - name: Name the asset
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-dev-profile.apk "../dist/forme-${TAG}-android-${MODE}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  ios:
    name: iOS builds
    runs-on: macos-latest
    continue-on-error: true   # never block the Android download on an iOS toolchain hiccup
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: App config (dev backend or offline demo)
        env:
          CONFIG_DEV_JSON: ${{ secrets.CONFIG_DEV_JSON }}
        run: |
          if [ -n "$CONFIG_DEV_JSON" ]; then
            printf '%s' "$CONFIG_DEV_JSON" > config/dev.json
            echo "DEFINES=--dart-define-from-file=config/dev.json" >> "$GITHUB_ENV"
          else
            echo "DEFINES=--dart-define-from-file=config/demo.json" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get
      - name: Unsigned device IPA (for re-signing with AltStore / Sideloadly / your own team)
        run: |
          mkdir -p ../dist
          flutter build ios --profile --no-codesign $DEFINES
          rm -rf Payload && mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/forme-${TAG}-ios-unsigned.ipa" Payload
      - name: Simulator app (x86_64; runs in the iOS Simulator, via Rosetta on Apple Silicon)
        # GoogleMLKit ships no arm64-simulator slice, so build the Intel slice explicitly.
        continue-on-error: true
        run: |
          flutter build ios --simulator --debug --config-only $DEFINES
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/sim ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build -quiet
          (cd build/sim/Build/Products/Debug-iphonesimulator && \
            zip -qry "../../../../../../dist/forme-${TAG}-ios-simulator-x86_64.app.zip" Runner.app)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/* }

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums + notes
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          {
            echo "## Test builds for ${TAG}"
            echo
            echo "| File | Install |"
            echo "|---|---|"
            echo "| \`*-android-*.apk\` | Download on the phone → open → allow *Install unknown apps*. Works on emulators too. |"
            echo "| \`*-ios-simulator-x86_64.app.zip\` | Unzip, then drag \`Runner.app\` onto a booted iOS Simulator (Xcode on a Mac; Rosetta on Apple Silicon). |"
            echo "| \`*-ios-unsigned.ipa\` | Not installable as-is: iPhones only run signed apps. Re-sign with AltStore/Sideloadly (free Apple ID, 7-day expiry) or use TestFlight. |"
            echo
            echo "\`offline-demo\` builds need no account: everything (AI, purchases, sync) is simulated on the device."
            echo "Debug tools (welcome screen → *Debug tools*) simulate the day-7 check-in and trial expiry."
            echo
            echo "SHA-256: see \`SHA256SUMS.txt\`."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Forme AI ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
