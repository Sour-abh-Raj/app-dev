# Cloud Run service (gcloud run services replace service.yaml --region=<region>)
# Replace PROJECT_ID / REGION / image tag; secrets live in Secret Manager.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: forme-ai
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60
      serviceAccountName: forme-ai@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/forme/forme-ai:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet: { path: /healthz }
          env:
            - { name: FORME_ENV, value: prod }
            # Any vendor: openai_compat (OpenAI, OpenRouter, Together, Groq, …) or anthropic.
            - { name: AI_PROVIDER, value: openai_compat }
            - { name: AI_BASE_URL, value: https://openrouter.ai/api/v1 }
            - { name: AI_MODEL_DEFAULT, value: VENDOR_MODEL_ID }
            - { name: AI_JSON_MODE, value: json_schema }
            # USD per 1M tokens for the chosen model (spend ceiling); omit → conservative default
            - { name: AI_PRICE_INPUT_PER_MTOK, value: "0" }
            - { name: AI_PRICE_OUTPUT_PER_MTOK, value: "0" }
            - { name: STORE, value: firestore }
            - { name: STORAGE_BUCKET, value: PROJECT_ID.firebasestorage.app }
            - { name: ADMIN_AUDIENCE, value: https://forme-ai-HASH-REGION.a.run.app }
            - { name: ADMIN_SERVICE_ACCOUNTS, value: forme-admin@PROJECT_ID.iam.gserviceaccount.com }
            - name: AI_API_KEY   # with AI_PROVIDER=anthropic, mount it as ANTHROPIC_API_KEY instead
              valueFrom: { secretKeyRef: { name: ai-api-key, key: latest } }
            - name: PROMO_PEPPER
              valueFrom: { secretKeyRef: { name: promo-pepper, key: latest } }
            - name: REVENUECAT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: revenuecat-secret-key, key: latest } }
